<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콩이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="콩이">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f8f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">
<style>
/* Layout: 휴대폰 한 화면 앱. 위에 콩이와 한마디, 가운데 "지금 할 일" 카드, 아래 고정 탭 3개 */
:root {
  --paper: #f5f8f1;
  --surface: #ffffff;
  --ink: #1f2a22;
  --muted: #5b6a5e;
  --line: #dbe3d5;
  --accent: #3d8a55;
  --accent-ink: #ffffff;
  --accent-soft: #e4f1e1;
  --warm: #b8642a;
  --warm-soft: #fbeee2;
  --bean: #c5e29e; --bean-edge: #6c984a; --belly: #e6f3d2; --leaf: #6dbd67; --leaf-dark: #3e8944;
  --cheek: #f3a39c; --eye: #2a2b26; --mouth: #b4504a; --petal: #f6b4c6; --pollen: #ffd166;
  --water: #86c3ee; --glass: #dff0fa;
  --font-display: "Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", cursive;
  --font-body: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131915; --surface: #1b231e; --ink: #e6eee7; --muted: #9db0a1; --line: #2b382f;
    --accent: #7cc592; --accent-ink: #10180f; --accent-soft: #223328; --warm: #f0a46b; --warm-soft: #33261c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131915; --surface: #1b231e; --ink: #e6eee7; --muted: #9db0a1; --line: #2b382f;
  --accent: #7cc592; --accent-ink: #10180f; --accent-soft: #223328; --warm: #f0a46b; --warm-soft: #33261c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px;
}
h1 { font-size: 28px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }

.hello { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: center; }
.hello svg { width: 76px; height: 76px; }
.say { font-family: var(--font-display); font-size: 24px; line-height: 1.25; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.now { background: var(--accent-soft); border-color: transparent; border-radius: 22px; padding: 20px; gap: 6px; }
.now.late { background: var(--warm-soft); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.now .name { font-size: 26px; font-weight: 700; }
.late .when { color: var(--warm); font-weight: 600; }
.big-btn {
  margin-top: 10px; width: 100%; border: 0; border-radius: 16px; padding: 16px;
  background: var(--accent); color: var(--accent-ink); font-size: 20px; font-weight: 700;
}
.big-btn:active { transform: scale(.98); }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; font-weight: 600;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--warm); }
.btn.wide { width: 100%; padding: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.row .title { font-weight: 600; }
.check { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; }
.list { display: grid; gap: 8px; }
.notice { background: var(--warm-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.empty { text-align: center; padding: 28px 8px; display: grid; gap: 12px; justify-items: center; }

/* 정원 */
.garden { text-align: center; justify-items: center; }
.garden svg { width: 210px; height: 210px; }
.pts { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bar { width: 100%; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.event { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.event:last-child { border-bottom: 0; }
.plus { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

/* 탭 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button {
  border: 0; background: none; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 2px;
  font-size: 12px; color: var(--muted); font-weight: 600;
}
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs svg { width: 24px; height: 24px; }

/* 모달 */
.scrim {
  position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 12, .45);
  display: grid; align-items: end; justify-items: center;
}
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  background: var(--paper); border-radius: 22px 22px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px;
}
.sheet-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.sheet-head h2 { text-align: center; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px; }
.linkbtn[disabled] { opacity: .4; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="time"], input[type="number"], textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea { min-height: 120px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
.times { display: grid; gap: 8px; }
.time-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.toggle { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.help { font-size: 13px; color: var(--muted); }

.celebrate {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none;
}
.celebrate .box {
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 24px 28px;
  display: grid; justify-items: center; gap: 4px; box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
}
.celebrate svg { width: 130px; height: 130px; }
.celebrate .pts { font-size: 32px; }
@media (prefers-reduced-motion: no-preference) {
  .celebrate .box { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
}
.toast {
  position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; z-index: 40;
  bottom: calc(90px + env(safe-area-inset-bottom, 0px)); max-width: min(480px, calc(100% - 32px)); text-align: center;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px;
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<nav class="tabs" aria-label="탭">
  <div class="in">
    <button type="button" id="tab-today" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      오늘
    </button>
    <button type="button" id="tab-garden" data-tab="garden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 13c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 15c0-3-2.5-5.5-7-5.5 0 4 2.5 5.5 7 5.5z"/></svg>
      나의 정원
    </button>
    <button type="button" id="tab-settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="18" r="2" fill="var(--surface)"/></svg>
      기록·설정
    </button>
  </div>
</nav>

<script>
"use strict";

/* ---------- 콩이 그림 (iOS 앱의 KongiView와 같은 모양) ---------- */
function koni(o) {
  const stage = o.stage ?? 2, face = o.face || "normal", prop = o.prop || null;
  const up = face === "happy" || face === "sparkle";
  const R = 'stroke-linecap="round" stroke-linejoin="round"';
  const B = 'fill="var(--bean)" stroke="var(--bean-edge)" stroke-width="3"';
  let s = '<svg viewBox="0 0 200 200" role="img" aria-label="' + (o.label || "콩이") + '">';
  s += '<ellipse cx="100" cy="182" rx="46" ry="7" fill="var(--bean-edge)" opacity=".18"/>';
  s += '<ellipse cx="84" cy="173" rx="13" ry="7" ' + B + '/><ellipse cx="116" cy="173" rx="13" ry="7" ' + B + '/>';
  if (up) {
    s += '<ellipse cx="48" cy="98" rx="9" ry="15" transform="rotate(-35 48 98)" ' + B + '/>';
    s += '<ellipse cx="152" cy="98" rx="9" ry="15" transform="rotate(35 152 98)" ' + B + '/>';
  } else {
    s += '<ellipse cx="51" cy="132" rx="9" ry="15" transform="rotate(22 51 132)" ' + B + '/>';
    s += '<ellipse cx="149" cy="132" rx="9" ry="15" transform="rotate(-22 149 132)" ' + B + '/>';
  }
  s += '<path d="M100 52 C143 52 157 92 153 124 C149 158 127 172 100 172 C73 172 51 158 47 124 C43 92 57 52 100 52Z" fill="var(--bean)" stroke="var(--bean-edge)" stroke-width="3.5"/>';
  s += '<ellipse cx="100" cy="140" rx="30" ry="22" fill="var(--belly)"/>';
  s += '<path d="M68 76 Q76 66 88 64" fill="none" stroke="#ffffff" stroke-width="4" opacity=".6" ' + R + '/>';
  s += '<ellipse cx="72" cy="123" rx="9" ry="6" fill="var(--cheek)" opacity=".75"/><ellipse cx="128" cy="123" rx="9" ry="6" fill="var(--cheek)" opacity=".75"/>';
  const L = 'fill="none" stroke="var(--eye)" stroke-width="3.5" ' + R;
  if (face === "happy") s += '<path d="M75 111 Q82 101 89 111" ' + L + '/><path d="M111 111 Q118 101 125 111" ' + L + '/>';
  else if (face === "calm") s += '<path d="M75 107 Q82 114 89 107" ' + L + '/><path d="M111 107 Q118 114 125 107" ' + L + '/>';
  else if (face === "sleepy") s += '<path d="M75 110 H89" ' + L + '/><path d="M111 110 H125" ' + L + '/>';
  else {
    const r = face === "sparkle" ? 7.5 : 5.8;
    s += '<circle cx="82" cy="107" r="' + r + '" fill="var(--eye)"/><circle cx="118" cy="107" r="' + r + '" fill="var(--eye)"/>';
    s += '<circle cx="84.5" cy="104.5" r="2" fill="#fff"/><circle cx="120.5" cy="104.5" r="2" fill="#fff"/>';
  }
  if (up) s += '<path d="M91 121 Q100 136 109 121 Z" fill="var(--mouth)" stroke="var(--eye)" stroke-width="2.5" ' + R + '/>';
  else if (face === "calm") s += '<ellipse cx="100" cy="126" rx="3.5" ry="4" fill="var(--eye)"/>';
  else if (face === "sleepy") s += '<ellipse cx="100" cy="126" rx="2.5" ry="2" fill="var(--eye)"/>';
  else s += '<path d="M93 122 Q100 130 107 122" fill="none" stroke="var(--eye)" stroke-width="3" ' + R + '/>';
  if (stage === 0) {
    s += '<path d="M100 53 Q97 46 102 43" fill="none" stroke="var(--leaf-dark)" stroke-width="4" ' + R + '/>';
  } else {
    s += '<path d="M100 53 Q97 41 101 29" fill="none" stroke="var(--leaf-dark)" stroke-width="4" ' + R + '/>';
    s += '<path d="M101 35 Q117 19 132 27 Q119 43 101 35Z" fill="var(--leaf)" stroke="var(--leaf-dark)" stroke-width="2.5" ' + R + '/>';
    if (stage >= 2) s += '<path d="M99 41 Q83 25 68 33 Q81 49 99 41Z" fill="var(--leaf)" stroke="var(--leaf-dark)" stroke-width="2.5" ' + R + '/>';
    if (stage >= 3) {
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
        s += '<circle cx="' + (101 + Math.cos(a) * 8).toFixed(1) + '" cy="' + (21 + Math.sin(a) * 8).toFixed(1) + '" r="6.5" fill="var(--petal)" stroke="var(--bean-edge)" stroke-width="1.5"/>';
      }
      s += '<circle cx="101" cy="21" r="5" fill="var(--pollen)"/>';
    }
  }
  if (prop === "star") s += '<path d="M162 48 L166 58 L177 59 L169 66 L171 77 L162 71 L153 77 L155 66 L147 59 L158 58 Z" fill="var(--pollen)" stroke="var(--bean-edge)" stroke-width="2" ' + R + '/>';
  if (prop === "heart") s += '<path d="M160 64 C160 55 148 53 148 61 C148 69 160 75 160 79 C160 75 172 69 172 61 C172 53 160 55 160 64Z" fill="var(--cheek)" stroke="var(--mouth)" stroke-width="2" ' + R + '/>';
  if (prop === "zzz") s += '<g fill="var(--bean-edge)" font-family="Gaegu, cursive" font-weight="700"><text x="146" y="74" font-size="16">z</text><text x="158" y="58" font-size="21">z</text><text x="172" y="40" font-size="27">z</text></g>';
  return s + "</svg>";
}

/* ---------- 대사 ---------- */
const LINES = {
  greet: ["오늘도 왔네!", "반가워!", "천천히 해도 돼", "오늘 하나만 해볼까?", "콩이 여기 있어"],
  took: ["기록 완료! 콩이가 쑥 컸어", "챙겼다! 잘했어", "오늘 약 체크!", "좋아, 하나 끝!", "콩이 기분 최고야"],
  comeback: ["보고 싶었어! 포인트 두 배야", "다시 와줘서 고마워", "돌아왔구나! 이어서 해보자", "기다리고 있었어", "오늘부터 다시 하면 돼"],
  done: ["오늘 약은 다 챙겼어!", "오늘 할 일 끝! 푹 쉬어", "다 했다! 콩이 뿌듯해", "오늘은 여기까지면 충분해", "멋지다, 오늘 완료!"],
  cutoff: ["오늘은 여기까지. 내일 또 보자", "늦은 시간이니까 오늘은 쉬어 가자", "내일 아침에 다시 챙기자", "괜찮아, 내일 또 하면 돼", "오늘은 푹 자자"],
  late: ["시간이 조금 지났어. 지금 먹어도 괜찮아?", "깜빡했어도 괜찮아, 지금 챙겨볼까?", "아직이면 지금 어때?"]
};
const pick = a => a[Math.floor(Math.random() * a.length)];
const SAY = { greet: pick(LINES.greet), done: pick(LINES.done), cutoff: pick(LINES.cutoff), late: pick(LINES.late) };

/* ---------- 저장 (이 기기의 브라우저 안에만) ---------- */
const KEY = "kongi.v1";
function emptyDb() { return { meds: [], logs: [], points: [] }; }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.meds) && Array.isArray(d.logs) && Array.isArray(d.points)) return d;
  } catch (e) {}
  return emptyDb();
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("저장하지 못했어요. 개인정보 보호 브라우징이면 꺼 주세요."); }
}
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);

/* ---------- 시간 ---------- */
const HOUR = 3600000, DAY = 24 * HOUR;
const sameDay = (a, b) => { const x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate(); };
const minOfDay = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
const fmtMin = m => { const h = Math.floor(m / 60), mm = m % 60; return (h < 12 ? "오전 " : "오후 ") + (h % 12 === 0 ? 12 : h % 12) + ":" + String(mm).padStart(2, "0"); };
const fmtTime = t => fmtMin(minOfDay(t));
const toHHMM = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const fromHHMM = s => { const [h, m] = String(s).split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 복약 규칙 (iOS 앱의 DoseRules와 같음) ---------- */
const DUP_WINDOW = 2 * HOUR, REFILL_DAYS = 7, DOSE_POINTS = 10, COMEBACK_GAP = 3 * DAY;
const STAGES = [{ n: 0, name: "씨앗", th: 0 }, { n: 1, name: "새싹", th: 100 }, { n: 2, name: "두 잎", th: 500 }, { n: 3, name: "꽃", th: 1500 }];

const planned = m => Math.max(m.times.length, 1);
const dosesOn = (m, now) => db.logs.filter(l => l.medId === m.id && sameDay(l.at, now)).map(l => l.at).sort((a, b) => a - b);
const isDone = (m, now) => dosesOn(m, now).length >= planned(m);
const lastTaken = m => db.logs.reduce((x, l) => l.medId === m.id && (x === null || l.at > x) ? l.at : x, null);
const pastCutoff = (m, now) => m.cutoff != null && minOfDay(now) >= m.cutoff;
const nextPlanned = (m, now) => { const t = [...m.times].sort((a, b) => a - b), n = dosesOn(m, now).length; return n < t.length ? t[n] : null; };
const needsConfirm = (m, now) => isDone(m, now) || (lastTaken(m) !== null && now - lastTaken(m) < DUP_WINDOW);
const daysLeft = m => m.remaining == null ? null : Math.floor(m.remaining / planned(m));
const totalPoints = () => db.points.reduce((s, p) => s + p.amount, 0);
const lastActivity = () => db.points.length ? Math.max(...db.points.map(p => p.at)) : null;
const stageFor = p => STAGES.filter(s => p >= s.th).pop();

function logDose(m) {
  const now = Date.now(), la = lastActivity();
  const comeback = la !== null && now - la >= COMEBACK_GAP;
  const pts = DOSE_POINTS * (comeback ? 2 : 1);
  db.logs.push({ id: uid(), medId: m.id, at: now });
  if (m.remaining != null) m.remaining = Math.max(0, m.remaining - 1);
  db.points.push({ id: uid(), amount: pts, reason: comeback ? m.name + " · 다시 돌아온 보너스" : m.name + " 복용", at: now });
  // 오래된 복약 기록은 120일만 남긴다 (포인트 기록은 그대로)
  db.logs = db.logs.filter(l => now - l.at < 120 * DAY);
  save();
  return { pts, comeback };
}

/* ---------- 화면 ---------- */
const app = document.getElementById("app");
let tab = "today";

function render() {
  const now = Date.now();
  if (tab === "today") app.innerHTML = viewToday(now);
  else if (tab === "garden") app.innerHTML = viewGarden();
  else app.innerHTML = viewSettings();
  document.querySelectorAll("nav.tabs button").forEach(b => {
    if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}

function nextMed(now) {
  return db.meds
    .filter(m => !isDone(m, now) && !pastCutoff(m, now))
    .sort((a, b) => (nextPlanned(a, now) ?? 9999) - (nextPlanned(b, now) ?? 9999))[0] || null;
}

function viewToday(now) {
  const stage = stageFor(totalPoints()).n;
  const nm = nextMed(now);
  const isLate = nm && nextPlanned(nm, now) !== null && minOfDay(now) >= nextPlanned(nm, now);
  let say = SAY.greet;
  if (db.meds.length) {
    if (nm) say = isLate ? SAY.late : SAY.greet;
    else say = db.meds.some(m => !isDone(m, now) && pastCutoff(m, now)) ? SAY.cutoff : SAY.done;
  }
  const face = !nm && db.meds.length ? (db.meds.some(m => !isDone(m, now)) ? "sleepy" : "happy") : "normal";
  let h = '<div class="hello">' + koni({ stage, face, prop: face === "sleepy" ? "zzz" : null }) + '<p class="say">' + esc(say) + "</p></div>";

  if (!db.meds.length) {
    return h + '<div class="card empty"><p class="muted">먹는 약을 추가하면<br>시간에 맞춰 챙길 수 있게 도와줄게</p>' +
      '<button type="button" class="btn primary" data-act="add">약 추가하기</button></div>';
  }

  if (nm) {
    const np = nextPlanned(nm, now);
    h += '<section class="card now' + (isLate ? " late" : "") + '"><span class="label">지금 할 일</span>' +
      '<span class="name">' + esc(nm.name) + "</span>" +
      (np !== null ? '<span class="when muted">' + fmtMin(np) + (isLate ? " · 시간이 지났어요" : " 예정") + "</span>" : "") +
      '<button type="button" class="big-btn" data-act="take" data-id="' + nm.id + '">먹었어요</button></section>';
  }

  db.meds.forEach(m => {
    const d = daysLeft(m);
    if (d !== null && d <= REFILL_DAYS) h += '<p class="notice">' + esc(m.name) + " 약이 " + d + "일분 남았어요. 병원 예약·처방 챙길 때예요.</p>";
  });

  h += '<section class="list"><h2>오늘의 약</h2>';
  db.meds.forEach(m => {
    const taken = dosesOn(m, now), done = isDone(m, now), cut = pastCutoff(m, now);
    let status;
    if (done) status = "✓ " + fmtTime(taken[taken.length - 1]);
    else if (cut) status = "마감 시간이 지나서 오늘은 쉬어 가요";
    else status = taken.length + "/" + planned(m) + " · " + [...m.times].sort((a, b) => a - b).map(fmtMin).join(", ");
    const right = done ? '<span class="check" aria-label="오늘 완료">✓</span>'
      : cut ? "" : '<button type="button" class="btn" data-act="take" data-id="' + m.id + '">먹었어요</button>';
    h += '<div class="card row"><div><div class="title">' + esc(m.name) + '</div><div class="small muted">' + status + "</div></div>" + right + "</div>";
  });
  h += "</section>";
  return h;
}

function viewGarden() {
  const total = totalPoints(), st = stageFor(total), next = STAGES[st.n + 1];
  let h = '<h1>나의 정원</h1><section class="card garden">' + koni({ stage: st.n, face: "normal", label: "콩이, " + st.name }) +
    "<h2>" + st.name + '</h2><div class="pts">' + total + "P</div>";
  if (next) {
    const pct = Math.round(((total - st.th) / (next.th - st.th)) * 100);
    h += '<div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div>' +
      '<p class="small muted">' + next.name + "까지 " + (next.th - total) + "P</p>";
  } else {
    h += '<p class="say">콩이가 꽃을 피웠어!</p>';
  }
  h += '<p class="tiny muted">포인트는 줄어들지 않아요. 며칠 쉬어도 콩이는 시들지 않아요.</p></section>';
  const recent = [...db.points].sort((a, b) => b.at - a.at).slice(0, 10);
  if (recent.length) {
    h += '<section class="card"><h2>최근 기록</h2><div>';
    recent.forEach(p => {
      const d = new Date(p.at);
      h += '<div class="event"><div><div>' + esc(p.reason) + '</div><div class="tiny muted">' + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + fmtTime(p.at) +
        '</div></div><span class="plus">+' + p.amount + "</span></div>";
    });
    h += "</div></section>";
  }
  return h;
}

function viewSettings() {
  let h = '<h1>기록·설정</h1><section class="card"><h2>내 약</h2><div class="list">';
  db.meds.forEach(m => {
    h += '<button type="button" class="btn" style="text-align:left" data-act="edit" data-id="' + m.id + '"><div>' + esc(m.name) +
      '</div><div class="small muted" style="font-weight:400">' + [...m.times].sort((a, b) => a - b).map(fmtMin).join(", ") + "</div></button>";
  });
  h += '<button type="button" class="btn primary" data-act="add">약 추가</button></div></section>';

  h += '<section class="card"><h2>알림 받기</h2>' +
    '<p class="small">웹앱은 스스로 알림을 예약하지 못해서, 약 시간을 <b>iPhone 캘린더 알림</b>으로 등록해요. 매일 반복되고, Apple Watch에도 떠요.</p>' +
    '<ol class="small" style="margin:0;padding-left:20px"><li>아래 버튼을 눌러 파일을 받아요.</li><li>"모두 추가"를 누르면 캘린더에 들어가요.</li><li>약 시간을 바꾸면 캘린더에서 옛 일정을 지우고 다시 받아요.</li></ol>' +
    '<button type="button" class="btn wide" data-act="ics"' + (db.meds.length ? "" : " disabled") + '>캘린더 알림 파일 받기</button>' +
    '<p class="help">버튼이 안 되면 홈 화면 앱 대신 Safari에서 이 주소를 열고 눌러 주세요. 알림에서 바로 "먹었어요"를 누를 수는 없어서, 기록은 콩이를 열어서 해요.</p></section>';

  h += '<section class="card"><h2>홈 화면에 추가</h2><p class="small">Safari 아래쪽 공유 버튼 → "홈 화면에 추가"를 누르면 앱처럼 쓸 수 있어요.</p></section>';

  h += '<section class="card"><h2>백업</h2>' +
    '<p class="small">기록은 이 기기의 이 브라우저 안에만 저장돼요. Safari 방문 기록을 지우거나 기기를 바꾸면 사라질 수 있으니 가끔 백업해 두세요.</p>' +
    '<div class="row" style="grid-template-columns:1fr 1fr"><button type="button" class="btn" data-act="backup">백업 복사</button><button type="button" class="btn" data-act="restore">백업 불러오기</button></div>' +
    '<p class="help">복사한 내용을 메모 앱에 붙여 넣어 두면 돼요.</p></section>';

  h += '<section class="card"><h2>안내</h2><p class="small">콩이는 의료 조언을 하지 않아요. 약의 용량과 시간은 처방받은 대로 입력하고, 바꾸고 싶으면 의사와 상의해 주세요.</p></section>';
  return h;
}

/* ---------- 모달 ---------- */
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "scrim";
  modalEl.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + "</div>";
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const f = modalEl.querySelector("input, button");
  if (f) f.focus();
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }

function confirmTake(m) {
  const last = lastTaken(m);
  openModal('<h2 style="text-align:center">이미 드신 것 같아요</h2>' +
    '<p class="small" style="text-align:center">' + esc(m.name) + (last ? "은 " + fmtTime(last) + "에 기록돼 있어요." : "은 오늘 정한 횟수를 다 채웠어요.") +
    "<br>정말 한 번 더 드셨으면 기록해 주세요.</p>" +
    '<button type="button" class="btn wide primary" data-act="take-force" data-id="' + m.id + '">한 번 더 기록하기</button>' +
    '<button type="button" class="btn wide" data-act="close">취소</button>');
}

function editor(m) {
  const times = m ? [...m.times].sort((a, b) => a - b) : [8 * 60];
  const timeRow = t => '<div class="time-row"><input type="time" class="t-in" value="' + toHHMM(t) + '" aria-label="먹는 시간"><button type="button" class="btn" data-act="time-del" aria-label="이 시간 지우기">빼기</button></div>';
  openModal(
    '<div class="sheet-head"><button type="button" class="linkbtn" data-act="close">취소</button><h2>' + (m ? "약 수정" : "약 추가") +
    '</h2><button type="button" class="linkbtn" data-act="save" data-id="' + (m ? m.id : "") + '">저장</button></div>' +
    '<label class="field"><span>약 이름</span><input type="text" id="f-name" maxlength="40" placeholder="예: 아침 ADHD 약" value="' + (m ? esc(m.name) : "") + '"></label>' +
    '<div class="field"><span>먹는 시간</span><div class="times" id="f-times">' + times.map(timeRow).join("") + "</div>" +
    '<button type="button" class="btn" data-act="time-add">시간 추가</button>' +
    '<p class="help">처방받은 대로 입력해 주세요. 콩이는 용량이나 시간을 추천하지 않아요.</p></div>' +
    '<div class="field"><label class="toggle"><span>늦은 복용 마감 시간</span><input type="checkbox" id="f-cut-on"' + (m && m.cutoff != null ? " checked" : "") + "></label>" +
    '<input type="time" id="f-cut" value="' + toHHMM(m && m.cutoff != null ? m.cutoff : 15 * 60) + '" aria-label="마감 시간">' +
    '<p class="help">늦게 먹으면 잠들기 어려운 약이라면 의사와 정한 시간을 넣어 주세요. 이 시간이 지나면 그날은 쉬어 가요.</p></div>' +
    '<div class="field"><label class="toggle"><span>남은 약 개수 세기</span><input type="checkbox" id="f-rem-on"' + (m && m.remaining != null ? " checked" : "") + "></label>" +
    '<input type="number" id="f-rem" min="0" max="999" inputmode="numeric" value="' + (m && m.remaining != null ? m.remaining : 30) + '" aria-label="남은 개수">' +
    '<p class="help">' + REFILL_DAYS + "일분 이하로 남으면 처방 받을 때라고 알려 줄게요.</p></div>" +
    (m ? '<button type="button" class="btn wide danger" data-act="delete" data-id="' + m.id + '">이 약 삭제</button>' : "")
  );
  editor.timeRow = timeRow;
}

function saveEditor(id) {
  const name = document.getElementById("f-name").value.trim();
  const times = [...new Set([...document.querySelectorAll(".t-in")].map(i => i.value).filter(Boolean).map(fromHHMM))].sort((a, b) => a - b);
  if (!name) { toast("약 이름을 넣어 주세요"); return; }
  if (!times.length) { toast("먹는 시간을 하나 이상 넣어 주세요"); return; }
  const cutoff = document.getElementById("f-cut-on").checked ? fromHHMM(document.getElementById("f-cut").value) : null;
  const remOn = document.getElementById("f-rem-on").checked;
  const remaining = remOn ? Math.max(0, parseInt(document.getElementById("f-rem").value, 10) || 0) : null;
  const m = db.meds.find(x => x.id === id);
  if (m) Object.assign(m, { name, times, cutoff, remaining });
  else db.meds.push({ id: uid(), name, times, cutoff, remaining, createdAt: Date.now() });
  save(); closeModal(); render();
  toast(m ? "저장했어요" : "추가했어요. 알림은 기록·설정에서 캘린더로 받을 수 있어요");
}

/* ---------- 캘린더 알림 파일 (.ics) ---------- */
function icsText(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function buildIcs() {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const ymd = "" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const stamp = d.toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Kongi//Kongi Web//KO", "CALSCALE:GREGORIAN", "X-WR-CALNAME:콩이 약 알림"];
  db.meds.forEach(m => {
    [...m.times].sort((a, b) => a - b).forEach(t => {
      out.push("BEGIN:VEVENT",
        "UID:kongi-" + m.id + "-" + t + "@kongi",
        "DTSTAMP:" + stamp,
        "DTSTART:" + ymd + "T" + pad(Math.floor(t / 60)) + pad(t % 60) + "00",
        "DURATION:PT5M",
        "RRULE:FREQ=DAILY",
        "SUMMARY:" + icsText("약: " + m.name),
        "DESCRIPTION:" + icsText("먹었으면 콩이에서 '먹었어요'를 눌러 주세요"),
        "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsText(m.name + " 먹을 시간이에요"), "TRIGGER:PT0M", "END:VALARM");
      // 30분 뒤 한 번 더 (마감 시간 전일 때만)
      if (m.cutoff == null || t + 30 < m.cutoff) {
        out.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsText("아직이면 지금 어때요? " + m.name), "TRIGGER:PT30M", "END:VALARM");
      }
      out.push("END:VEVENT");
    });
  });
  out.push("END:VCALENDAR");
  return out.join("\r\n") + "\r\n";
}
function downloadIcs() {
  try {
    const blob = new Blob([buildIcs()], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "kongi-alarms.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    toast("파일을 만들지 못했어요. Safari에서 다시 시도해 주세요.");
  }
}

/* ---------- 백업 ---------- */
function backup() {
  const text = JSON.stringify(db);
  const done = () => toast("백업을 복사했어요. 메모 앱에 붙여 넣어 두세요");
  const fallback = () => openModal('<h2>백업 내용</h2><p class="help">아래 글을 길게 눌러 모두 선택한 뒤 복사해 주세요.</p><textarea id="b-out" readonly>' + esc(text) + '</textarea><button type="button" class="btn wide" data-act="close">닫기</button>');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
function restoreSheet() {
  openModal('<h2>백업 불러오기</h2><p class="help">복사해 둔 백업을 붙여 넣으면 지금 기록을 바꿔 써요.</p><textarea id="b-in" placeholder="여기에 붙여 넣기"></textarea>' +
    '<button type="button" class="btn wide primary" data-act="restore-go">불러오기</button><button type="button" class="btn wide" data-act="close">취소</button>');
}
function restoreGo() {
  try {
    const d = JSON.parse(document.getElementById("b-in").value);
    if (!d || !Array.isArray(d.meds) || !Array.isArray(d.logs) || !Array.isArray(d.points)) throw new Error();
    db = d; save(); closeModal(); render(); toast("백업을 불러왔어요");
  } catch (e) { toast("백업 내용이 올바르지 않아요. 복사한 글 전체를 붙여 넣어 주세요"); }
}

/* ---------- 축하, 토스트 ---------- */
function celebrate(r) {
  const el = document.createElement("div");
  el.className = "celebrate";
  el.innerHTML = '<div class="box">' + koni({ stage: stageFor(totalPoints()).n, face: r.comeback ? "sparkle" : "happy", prop: r.comeback ? "heart" : "star" }) +
    '<div class="pts">+' + r.pts + 'P</div><p class="say" style="margin:0;text-align:center">' + esc(pick(r.comeback ? LINES.comeback : LINES.took)) + "</p></div>";
  document.body.appendChild(el);
  if (navigator.vibrate) navigator.vibrate(30);
  setTimeout(() => el.remove(), 1800);
}
let toastTimer = null;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e => {
  const tb = e.target.closest("nav.tabs button");
  if (tb) { tab = tb.dataset.tab; location.hash = tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, m = db.meds.find(x => x.id === b.dataset.id);
  if (act === "take" && m) {
    if (needsConfirm(m, Date.now())) confirmTake(m);
    else { const r = logDose(m); render(); celebrate(r); }
  } else if (act === "take-force" && m) {
    closeModal(); const r = logDose(m); render(); celebrate(r);
  } else if (act === "add") editor(null);
  else if (act === "edit" && m) editor(m);
  else if (act === "save") saveEditor(b.dataset.id);
  else if (act === "delete" && m) {
    openModal('<h2 style="text-align:center">' + esc(m.name) + ' 삭제할까요?</h2><p class="small" style="text-align:center">쌓인 포인트는 그대로 남아요.</p>' +
      '<button type="button" class="btn wide danger" data-act="delete-go" data-id="' + m.id + '">삭제</button><button type="button" class="btn wide" data-act="close">취소</button>');
  } else if (act === "delete-go" && m) {
    db.meds = db.meds.filter(x => x.id !== m.id); save(); closeModal(); render(); toast("삭제했어요. 캘린더의 옛 일정도 지워 주세요");
  } else if (act === "time-add") {
    document.getElementById("f-times").insertAdjacentHTML("beforeend", editor.timeRow(12 * 60));
  } else if (act === "time-del") {
    const rows = document.querySelectorAll(".time-row");
    if (rows.length > 1) b.closest(".time-row").remove(); else toast("시간은 하나 이상 있어야 해요");
  } else if (act === "ics") downloadIcs();
  else if (act === "backup") backup();
  else if (act === "restore") restoreSheet();
  else if (act === "restore-go") restoreGo();
  else if (act === "close") closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------- 시작 ---------- */
const startTab = location.hash.slice(1);
if (["today", "garden", "settings"].includes(startTab)) tab = startTab;
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (["today", "garden", "settings"].includes(t)) { tab = t; render(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !modalEl) render(); });
setInterval(() => { if (!document.hidden && !modalEl) render(); }, 60000);
render();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
