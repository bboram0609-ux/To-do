<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: "P"; font-weight: 600; src: url(Pretendard-SemiBold.woff2); }
@font-face { font-family: "P"; font-weight: 700; src: url(Pretendard-Bold.woff2); }
@font-face { font-family: "P"; font-weight: 800; src: url(Pretendard-ExtraBold.woff2); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1680px; background: #f6f1ea; font-family: "P", sans-serif; color: #2b2622; padding: 56px 64px 64px; }
header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; border-bottom: 3px solid #2b2622; padding-bottom: 22px; }
h1 { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; }
h1 small { display: block; font-size: 22px; font-weight: 600; color: #8a7d70; margin-bottom: 8px; letter-spacing: 0; }
.meta { text-align: right; font-size: 20px; font-weight: 600; color: #6d6156; line-height: 1.6; }
.meta b { color: #c2562f; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 44px 40px; }
.cell { display: flex; gap: 22px; }
.frame { flex: 0 0 216px; height: 384px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 3px #2b2622; position: relative; }
.frame svg { width: 216px; height: 384px; display: block; }
.info { flex: 1; padding-top: 4px; }
.num { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.num span:first-child { width: 40px; height: 40px; border-radius: 50%; background: #2b2622; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
.time { font-weight: 700; font-size: 18px; color: #c2562f; background: #fbe3d6; padding: 4px 12px; border-radius: 999px; }
.label { font-size: 15px; font-weight: 700; color: #a3968a; margin: 12px 0 4px; letter-spacing: 0.04em; }
.shot { font-size: 21px; font-weight: 800; }
.desc { font-size: 17px; font-weight: 600; line-height: 1.5; color: #4a423b; }
.line { font-size: 18px; font-weight: 700; line-height: 1.5; background: #fff; border-left: 5px solid #c2562f; padding: 10px 14px; border-radius: 6px; }
footer { margin-top: 44px; display: flex; gap: 18px; }
.tip { flex: 1; background: #fff; border-radius: 14px; padding: 18px 22px; font-size: 17px; font-weight: 600; line-height: 1.55; color: #4a423b; }
.tip b { display: block; font-size: 18px; color: #2b2622; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1><small>쇼츠 스토리보드 · 60초 · 세로 9:16</small>어른 연애 좋아하면 이 애니 꼭 봐</h1>
  <div class="meta">작품 〈슈퍼 뒤에서 담배 피는 두 사람〉<br>장소 <b>집 (소파 · 창가)</b> · 소품 <b>캔커피, 슈퍼 봉지, 담요</b></div>
</header>
<div class="grid" id="grid"></div>
<footer>
  <div class="tip"><b>🎬 애니 장면은 넣지 않아요</b>넷플릭스 화면 녹화·캡처는 저작권 신고 대상이에요. 제목은 2번 자막 카드로 대신해요.</div>
  <div class="tip"><b>🥫 담배 대신 캔커피</b>흡연 장면은 연령 제한이나 광고 제한이 걸릴 수 있어요. 캔 따는 소리로 분위기를 살려요.</div>
  <div class="tip"><b>✂️ 외우지 않아도 OK</b>구간별로 끊어서 여러 번 찍어 주세요. 이어 붙이기, 자막, 효과음은 편집에서 넣어요.</div>
</footer>
<script>
const SK = "#f3caa6", HAIR = "#3a2a24", SW = "#e3b34c", INK = "#2b2622";
// head: cx, cy, r, mood ('smile'|'talk'|'closed'|'wink')
function head(cx, cy, r, mood = "smile") {
  const e = r * 0.34, ey = cy + r * 0.08;
  let eyes, mouth;
  if (mood === "closed") {
    eyes = `<path d="M${cx-e-r*.12} ${ey} q${r*.12} ${r*.1} ${r*.24} 0 M${cx+e-r*.12} ${ey} q${r*.12} ${r*.1} ${r*.24} 0" stroke="${INK}" stroke-width="${r*.05}" fill="none" stroke-linecap="round"/>`;
  } else if (mood === "wink") {
    eyes = `<ellipse cx="${cx-e}" cy="${ey}" rx="${r*.07}" ry="${r*.1}" fill="${INK}"/><path d="M${cx+e-r*.12} ${ey} q${r*.12} ${r*.1} ${r*.24} 0" stroke="${INK}" stroke-width="${r*.05}" fill="none" stroke-linecap="round"/>`;
  } else {
    eyes = `<ellipse cx="${cx-e}" cy="${ey}" rx="${r*.07}" ry="${r*.1}" fill="${INK}"/><ellipse cx="${cx+e}" cy="${ey}" rx="${r*.07}" ry="${r*.1}" fill="${INK}"/>`;
  }
  if (mood === "talk") mouth = `<ellipse cx="${cx}" cy="${cy+r*.45}" rx="${r*.13}" ry="${r*.11}" fill="#9c3b2e"/>`;
  else mouth = `<path d="M${cx-r*.15} ${cy+r*.4} q${r*.15} ${r*.16} ${r*.3} 0" stroke="#9c3b2e" stroke-width="${r*.05}" fill="none" stroke-linecap="round"/>`;
  return `
  <path d="M${cx-r*1.12} ${cy-r*.1} Q${cx-r*1.2} ${cy+r*1.2} ${cx-r*.85} ${cy+r*1.25} L${cx+r*.85} ${cy+r*1.25} Q${cx+r*1.2} ${cy+r*1.2} ${cx+r*1.12} ${cy-r*.1} A${r*1.12} ${r*1.12} 0 0 0 ${cx-r*1.12} ${cy-r*.1}Z" fill="${HAIR}"/>
  <ellipse cx="${cx}" cy="${cy+r*.12}" rx="${r*.86}" ry="${r*.95}" fill="${SK}"/>
  <path d="M${cx-r*.95} ${cy-r*.05} Q${cx-r*.8} ${cy-r*1.05} ${cx} ${cy-r*1.02} Q${cx+r*.8} ${cy-r*1.05} ${cx+r*.95} ${cy-r*.05} Q${cx+r*.4} ${cy-r*.42} ${cx-r*.1} ${cy-r*.3} Q${cx-r*.55} ${cy-r*.45} ${cx-r*.95} ${cy-r*.05}Z" fill="${HAIR}"/>
  ${eyes}
  <ellipse cx="${cx-r*.52}" cy="${cy+r*.35}" rx="${r*.14}" ry="${r*.08}" fill="#ef9a86" opacity=".7"/>
  <ellipse cx="${cx+r*.52}" cy="${cy+r*.35}" rx="${r*.14}" ry="${r*.08}" fill="#ef9a86" opacity=".7"/>
  ${mouth}`;
}
function can(x, y, w, h) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*.18}" fill="#5b4a8f"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h*.12}" rx="${w*.1}" fill="#c9c6d6"/>
  <rect x="${x+w*.15}" y="${y+h*.35}" width="${w*.7}" height="${h*.3}" rx="3" fill="#f1d36b"/>`;
}
function cap(text, y = 340) {
  return `<rect x="16" y="${y-22}" width="238" height="38" rx="8" fill="rgba(0,0,0,.55)"/>
  <text x="135" y="${y+4}" text-anchor="middle" font-family="P" font-weight="800" font-size="15.5" fill="#fff">${text}</text>`;
}
function guide() { // rule-of-thirds guide lines
  return `<g stroke="#fff" stroke-opacity=".22" stroke-dasharray="4 5"><line x1="90" y1="0" x2="90" y2="480"/><line x1="180" y1="0" x2="180" y2="480"/><line x1="0" y1="160" x2="270" y2="160"/><line x1="0" y1="320" x2="270" y2="320"/></g>`;
}
const frames = [
 { time: "0 ~ 3초", shot: "얼굴 클로즈업 · 정면", desc: "휴대폰을 눈높이에 두고 얼굴이 화면 위쪽 2/3를 채우게. 캔커피를 볼 옆에서 '칙' 따면서 시작.",
   line: "설레는 연애 말고, 어른의 연애 좋아하는 사람?",
   svg: `<defs><radialGradient id="g1" cx=".75" cy=".2" r=".9"><stop offset="0" stop-color="#f6b678"/><stop offset="1" stop-color="#4a3a5c"/></radialGradient></defs>
   <rect width="270" height="480" fill="url(#g1)"/>${guide()}
   <path d="M20 480 Q30 360 135 345 Q240 360 250 480Z" fill="${SW}"/>
   ${head(135, 205, 92, "talk")}
   <ellipse cx="208" cy="300" rx="24" ry="20" fill="${SK}"/>${can(190, 236, 34, 58)}
   <g font-family="P" font-weight="800" fill="#fff"><text x="200" y="222" font-size="22" transform="rotate(-12 200 222)">칙!</text></g>
   <path d="M196 228 l-10 -12 M214 224 l2 -16 M228 232 l12 -10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
   ${cap("어른의 연애 좋아하는 사람? 🙋", 420)}` },
 { time: "3 ~ 10초", shot: "제목 자막 카드", desc: "촬영 X. 편집에서 만드는 화면. 퇴근길 슈퍼 뒷문 느낌의 일러스트 위에 작품 제목.",
   line: "넷플릭스에 있는 〈슈퍼 뒤에서 담배 피는 두 사람〉인데요",
   svg: `<defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1c33"/><stop offset="1" stop-color="#3b2e45"/></linearGradient><radialGradient id="lamp" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
   <rect width="270" height="480" fill="url(#g2)"/>
   <rect x="0" y="250" width="270" height="230" fill="#2a2638"/>
   <rect x="60" y="270" width="70" height="140" fill="#4c4660"/><rect x="66" y="276" width="58" height="128" fill="#3a3550"/>
   <circle cx="95" cy="262" r="6" fill="#ffd27a"/><path d="M40 268 L150 268 L190 420 L0 420Z" fill="url(#lamp)"/>
   <rect x="170" y="320" width="56" height="90" rx="4" fill="#6a8fb3"/><rect x="176" y="328" width="44" height="40" rx="3" fill="#bfe0f5"/>
   <circle cx="150" cy="378" r="9" fill="#151322"/><rect x="142" y="388" width="16" height="30" rx="7" fill="#151322"/>
   <circle cx="246" cy="374" r="10" fill="#151322"/><rect x="237" y="385" width="18" height="34" rx="8" fill="#151322"/>
   <rect x="0" y="418" width="270" height="62" fill="#1a1828"/>
   <rect x="78" y="70" width="114" height="26" rx="13" fill="#e5484d"/>
   <text x="135" y="88" text-anchor="middle" font-family="P" font-weight="800" font-size="13" fill="#fff">넷플릭스 애니 추천</text>
   <text x="135" y="140" text-anchor="middle" font-family="P" font-weight="800" font-size="25" fill="#fff">슈퍼 뒤에서</text>
   <text x="135" y="176" text-anchor="middle" font-family="P" font-weight="800" font-size="25" fill="#ffd27a">담배 피는 두 사람</text>
   <text x="135" y="210" text-anchor="middle" font-family="P" font-weight="600" font-size="13" fill="#c9c3dc">퇴근 후, 잠깐 쉬어가는 어른들의 대화</text>` },
 { time: "10 ~ 25초", shot: "미디엄 샷 · 소파에 앉아서", desc: "휴대폰을 1~1.5m 떨어진 삼각대에. 허리 위가 보이게. 뒤에 스탠드 조명 켜고 창가 쪽 자연광.",
   line: "제목 그대로, 슈퍼 뒤에서 잠깐 쉬는 두 사람의 대화가 중심이에요. [스포 없이 한두 문장]",
   svg: `<defs><radialGradient id="g3" cx=".85" cy=".3" r=".7"><stop offset="0" stop-color="#ffe0a8"/><stop offset="1" stop-color="#e9dccb"/></radialGradient></defs>
   <rect width="270" height="480" fill="url(#g3)"/>${guide()}
   <rect x="18" y="70" width="70" height="120" rx="4" fill="#f2a46a"/><rect x="18" y="70" width="70" height="120" rx="4" fill="none" stroke="#fff" stroke-width="5"/><line x1="53" y1="70" x2="53" y2="190" stroke="#fff" stroke-width="4"/>
   <line x1="236" y1="110" x2="236" y2="330" stroke="#6d5a4a" stroke-width="4"/><path d="M214 110 L258 110 L248 80 L224 80Z" fill="#f5d38a"/>
   <rect x="20" y="290" width="230" height="110" rx="26" fill="#8a9a7b"/><rect x="34" y="250" width="202" height="70" rx="22" fill="#9caa8d"/>
   <rect x="96" y="250" width="78" height="100" rx="26" fill="${SW}"/>
   ${head(135, 205, 36, "talk")}
   <rect x="80" y="330" width="110" height="46" rx="18" fill="#e8d6ea"/>
   <path d="M150 300 q20 10 30 -6" stroke="${SK}" stroke-width="10" fill="none" stroke-linecap="round"/>
   <rect x="196" y="352" width="44" height="8" rx="3" fill="#6d5a4a"/>${can(207, 326, 16, 27)}
   <path d="M150 120 h96 a10 10 0 0 1 10 10 v26 a10 10 0 0 1 -10 10 h-70 l-12 12 l2 -12 h-16 a10 10 0 0 1 -10 -10 v-26 a10 10 0 0 1 10 -10z" fill="#fff"/>
   <text x="198" y="148" text-anchor="middle" font-family="P" font-weight="800" font-size="14" fill="${INK}">이 애니는요…</text>
   ${cap("슈퍼 뒤에서 나누는 대화가 중심 💬", 430)}` },
 { time: "25 ~ 45초", shot: "상반신 + 손가락 제스처", desc: "카메라에 손을 내밀며 1, 2, 3 세기. 숫자마다 자막 카드가 '톡' 튀어나오게 편집.",
   line: "제가 좋았던 점 세 가지! 첫째 [ ], 둘째 [ ], 셋째 [ ]",
   svg: `<rect width="270" height="480" fill="#f4e6d8"/>${guide()}
   <path d="M20 480 Q30 350 110 336 Q200 350 230 480Z" fill="${SW}"/>
   ${head(98, 262, 54, "smile")}
   <g transform="translate(160 236)">
     <rect x="18" y="58" width="78" height="76" rx="26" fill="${SK}"/>
     <rect x="22" y="0" width="18" height="70" rx="9" fill="${SK}"/><rect x="44" y="-10" width="18" height="78" rx="9" fill="${SK}"/><rect x="66" y="0" width="18" height="70" rx="9" fill="${SK}"/>
     <rect x="0" y="74" width="34" height="18" rx="9" fill="${SK}" transform="rotate(-20 17 83)"/>
   </g>
   <g font-family="P" font-weight="800" font-size="15">
     <rect x="16" y="56" width="150" height="34" rx="17" fill="#fff"/><circle cx="34" cy="73" r="12" fill="#c2562f"/><text x="34" y="78" text-anchor="middle" fill="#fff" font-size="13">1</text><text x="54" y="78" fill="${INK}">잔잔한 분위기</text>
     <rect x="16" y="98" width="150" height="34" rx="17" fill="#fff" opacity=".85"/><circle cx="34" cy="115" r="12" fill="#c2562f"/><text x="34" y="120" text-anchor="middle" fill="#fff" font-size="13">2</text><text x="54" y="120" fill="${INK}">현실 공감</text>
     <rect x="16" y="140" width="150" height="34" rx="17" fill="#fff" opacity=".7"/><circle cx="34" cy="157" r="12" fill="#c2562f"/><text x="34" y="162" text-anchor="middle" fill="#fff" font-size="13">3</text><text x="54" y="162" fill="${INK}">짧아서 딱</text>
   </g>
   ${cap("좋았던 점 세 가지! ✌️", 430)}` },
 { time: "45 ~ 55초", shot: "창가 · 뒷모습 / 옆모습", desc: "얼굴 안 나와도 OK. 노을 지는 창밖을 보며 캔커피 한 모금. 목소리는 화면 밖 내레이션으로.",
   line: "특히 [가장 좋았던 장면이나 대사의 느낌]… 이게 진짜 어른 연애 같았어요",
   svg: `<defs><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4a8f"/><stop offset=".55" stop-color="#f08a5d"/><stop offset="1" stop-color="#ffd27a"/></linearGradient></defs>
   <rect width="270" height="480" fill="#3a2f3a"/>
   <rect x="22" y="40" width="226" height="280" fill="url(#g5)"/>
   <circle cx="180" cy="250" r="26" fill="#ffe7a8" opacity=".9"/>
   <path d="M22 320 V270 h24 v-30 h20 v40 h18 v-55 h26 v45 h22 v-25 h30 v50 h20 v-35 h24 v40 h40 v60Z" fill="#2a2234"/>
   <rect x="22" y="40" width="226" height="280" fill="none" stroke="#e9dccb" stroke-width="8"/><line x1="135" y1="40" x2="135" y2="320" stroke="#e9dccb" stroke-width="6"/>
   <rect x="0" y="320" width="270" height="20" fill="#e9dccb"/>
   <path d="M30 480 Q36 380 100 372 Q164 380 170 480Z" fill="${SW}"/>
   <circle cx="100" cy="342" r="40" fill="${HAIR}"/><path d="M62 350 Q60 400 76 404 L124 404 Q140 400 138 350Z" fill="${HAIR}"/>
   <ellipse cx="160" cy="392" rx="15" ry="13" fill="${SK}"/>${can(150, 350, 20, 34)}
   ${cap("이게 진짜 어른 연애 같았어요", 450)}` },
 { time: "55 ~ 60초", shot: "얼굴 클로즈업 · 마무리", desc: "다시 1번과 같은 자리. 손 흔들며 인사. 마지막 1초는 '팔로우' 스티커가 뜨게 편집.",
   line: "퇴근하고 지친 날 보세요. 다음엔 이런 애니 더 추천할게요!",
   svg: `<defs><radialGradient id="g6" cx=".25" cy=".2" r=".9"><stop offset="0" stop-color="#f6b678"/><stop offset="1" stop-color="#4a3a5c"/></radialGradient></defs>
   <rect width="270" height="480" fill="url(#g6)"/>${guide()}
   <path d="M20 480 Q30 360 135 345 Q240 360 250 480Z" fill="${SW}"/>
   ${head(135, 205, 92, "wink")}
   <g transform="translate(196 222) rotate(18)">
     <rect x="0" y="40" width="50" height="50" rx="18" fill="${SK}"/>
     <rect x="2" y="2" width="11" height="48" rx="5.5" fill="${SK}"/><rect x="14" y="-6" width="11" height="54" rx="5.5" fill="${SK}"/><rect x="26" y="-4" width="11" height="52" rx="5.5" fill="${SK}"/><rect x="38" y="4" width="11" height="46" rx="5.5" fill="${SK}"/>
   </g>
   <path d="M250 214 q-8 8 0 16 M262 206 q-14 16 0 32" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
   <rect x="58" y="44" width="154" height="40" rx="20" fill="#c2562f"/>
   <text x="135" y="70" text-anchor="middle" font-family="P" font-weight="800" font-size="16" fill="#fff">+ 팔로우하고 다음 추천 보기</text>
   ${cap("다음엔 이런 애니 더 추천할게요!", 420)}` },
];
document.getElementById("grid").innerHTML = frames.map((f, i) => `
  <div class="cell">
    <div class="frame"><svg viewBox="0 0 270 480" xmlns="http://www.w3.org/2000/svg">${f.svg}</svg></div>
    <div class="info">
      <div class="num"><span>${i+1}</span><span class="time">${f.time}</span></div>
      <div class="label">구도</div><div class="shot">${f.shot}</div>
      <div class="label">화면</div><div class="desc">${f.desc}</div>
      <div class="label">대사</div><div class="line">${f.line}</div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
